# Ejercicio 5.1: el tipo de recurso DummySite. Kubernetes solo lo guarda;
# lo que pasa al crear uno lo decide el controller (../controller).
apiVersion: apiextensions.k8s.io/v1

kind: CustomResourceDefinition

metadata:
  # <plural>.<group>
  name: dummysites.stable.dwk

spec:
  group: stable.dwk
  scope: Namespaced

  names:
    kind: DummySite
    plural: dummysites
    singular: dummysite
    shortNames:
      - ds

  versions:
    - name: v1
      served: true
      storage: true

      # status como subrecurso: el controller escribe ahi el resultado sin
      # tocar el spec (y sin cambiar metadata.generation).
      subresources:
        status: {}

      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - website_url
              properties:
                website_url:
                  type: string
                  # Solo http(s): el controller descarga la pagina.
                  pattern: '^https?://.+'
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                url:
                  type: string
                observedGeneration:
                  type: integer

      additionalPrinterColumns:
        - name: Website
          type: string
          jsonPath: .spec.website_url
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Copy
          type: string
          description: Where the copy can be opened
          jsonPath: .status.url
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
