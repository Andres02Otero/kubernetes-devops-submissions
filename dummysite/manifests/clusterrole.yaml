# Lo minimo que necesita el controller. ClusterRole y no Role porque vigila
# los DummySite de TODOS los namespaces y crea sus recursos en cada uno.
# "patch" cubre crear y actualizar: el controller usa server-side apply.
apiVersion: rbac.authorization.k8s.io/v1

kind: ClusterRole

metadata:
  name: dummysite-controller-role

rules:
  - apiGroups: ["stable.dwk"]
    resources: ["dummysites"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["stable.dwk"]
    resources: ["dummysites/status"]
    verbs: ["get", "patch"]
  # El HTML de la copia (ConfigMap) y el Service que la expone.
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "create", "patch"]
