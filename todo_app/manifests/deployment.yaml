apiVersion: apps/v1

kind: Deployment

metadata:
  name: todo-app
  namespace: project

spec:
  replicas: 1

  # El PVC es ReadWriteOnce: con RollingUpdate el pod nuevo arranca antes
  # de que el viejo suelte el disco y, si cae en otro nodo, se queda
  # atascado. Recreate apaga el viejo primero (ejercicio 3.6).
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: todo-app

  template:
    metadata:
      labels:
        app: todo-app

    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: todo-app-image-pvc

      containers:
        - name: todo-app
          image: andres09otero/todo-app:1.5.0
          # Valores medidos con kubectl top en reposo y con margen para picos (ejercicio 3.11); los nodos son e2-small, asi que los requests van bajos.
          resources:
            requests:
              cpu: "25m"
              memory: "48Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          env:
            - name: PORT
              value: "3000"
            - name: TODO_BACKEND_URL
              value: "http://todo-backend-svc:2345"
            - name: IMAGE_CACHE_DIR
              value: "/usr/src/app/image-cache"
            - name: PICSUM_URL
              value: "https://picsum.photos/1200"
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/image-cache
