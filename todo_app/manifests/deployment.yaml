apiVersion: apps/v1

kind: Deployment

metadata:
  name: todo-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: todo-app

  template:
    metadata:
      labels:
        app: todo-app

    spec:
      containers:
        - name: todo-app
          image: andres09otero/todo-app:1.0.0
          env:
            - name: PORT
              value: "3000"
