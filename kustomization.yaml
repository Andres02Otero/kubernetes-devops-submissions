apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# El proyecto completo. Desde el ejercicio 4.8 esto es lo que ArgoCD
# sincroniza en el cluster k3d (ver argocd-application.yaml); hasta 4.7 era
# la lista que el pipeline de GKE aplicaba con kubectl (3.5 a 3.8). Los
# archivos de manifests-gke/ y persistent-volumes/gke/ quedan en el repo
# como historia de ese capitulo, pero ya no se despliegan.
# Va en la raiz porque Kustomize no deja leer archivos fuera de la carpeta
# del kustomization.yaml, y el proyecto esta repartido en varias carpetas.
resources:
  - namespaces/project-namespace.yaml

  # todo_backend + su Postgres
  - todo_backend/manifests/secret.yaml
  - todo_backend/manifests/postgres.yaml
  - todo_backend/manifests/deployment.yaml
  - todo_backend/manifests/service.yaml

  # todo_app: PV local de k3d + su PVC, e Ingress de Traefik
  - persistent-volumes/todoapp-image-pv.yaml
  - persistent-volumes/todoapp-image-pvc.yaml
  - todo_app/manifests/deployment.yaml
  - todo_app/manifests/service.yaml
  - todo_app/manifests/ingress.yaml

  # todo_random_article
  - todo_random_article/manifests/cronjob.yaml

  # todo_broadcaster (4.6) y el servicio externo simulado al que reenvia
  - todo_broadcaster/manifests/deployment.yaml
  - todo_broadcaster/manifests/generic-receiver.yaml

# El workflow .github/workflows/main.yaml reescribe estos tags con el SHA de
# cada commit que cambia codigo del proyecto, y hace commit de este archivo.
images:
  - name: andres09otero/todo-app
    newTag: 1.7.0
  - name: andres09otero/todo-backend
    newTag: 3.1.0
  - name: andres09otero/todo-random-article
    newTag: 1.0.0
  - name: andres09otero/todo-broadcaster
    newTag: 1.0.0
