apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ejercicio 4.9, entorno staging: la base (../base) tal como esta en main
# (ArgoCD sigue main, asi que cada commit llega aqui), en su propio
# namespace y con lo que el enunciado pide distinto.
resources:
- ../base

# Reescribe el namespace de todos los recursos, incluido el objeto
# Namespace de la base, que pasa a llamarse project-staging.
namespace: project-staging

# Cada parche usa target (tipo + nombre) porque los recursos de la base ya
# traen namespace: project y un parche sin namespace no los encontraria.
  # El broadcaster solo escribe los mensajes en su log: sin BROADCAST_URL
  # no reenvia nada (ver todo_broadcaster/src/index.js). Y su propio
  # subject de NATS, para no quitarle mensajes a production.

  # El backend publica en ese mismo subject de staging.

  # Sin backup de la base en staging.

  # Como no reenvia nada, el servicio externo simulado sobra.

  # El PV local de la base ya lo usa production (un PV solo se une a un
  # PVC): staging pide su disco al aprovisionador dinamico de k3d.

  # Los dos Ingress reclamarian / en Traefik: staging responde solo al host
  # staging.localhost (http://staging.localhost:8081) y production sigue
  # en http://localhost:8081.
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: broadcaster
    spec:
      template:
        spec:
          containers:
            - name: broadcaster
              env:
                - name: BROADCAST_URL
                  $patch: delete
                - name: NATS_SUBJECT
                  value: "staging.todos.status"
  target:
    kind: Deployment
    name: broadcaster
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: todo-backend
    spec:
      template:
        spec:
          containers:
            - name: todo-backend
              env:
                - name: NATS_SUBJECT
                  value: "staging.todos.status"
  target:
    kind: Deployment
    name: todo-backend
- patch: |-
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: todo-db-backup
    $patch: delete
  target:
    kind: CronJob
    name: todo-db-backup
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: generic-receiver
    $patch: delete
  target:
    kind: Deployment
    name: generic-receiver
- patch: |-
    apiVersion: v1
    kind: Service
    metadata:
      name: generic-receiver-svc
    $patch: delete
  target:
    kind: Service
    name: generic-receiver-svc
- patch: |-
    apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: todo-app-image-pv
    $patch: delete
  target:
    kind: PersistentVolume
    name: todo-app-image-pv
- patch: |-
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: todo-app-image-pvc
    spec:
      storageClassName: local-path
  target:
    kind: PersistentVolumeClaim
    name: todo-app-image-pvc
- patch: |-
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: todo-app-ingress
    spec:
      rules:
        - host: staging.localhost
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: todo-app-svc
                    port:
                      number: 1234
  target:
    kind: Ingress
    name: todo-app-ingress
images:
- name: andres09otero/todo-app
  newName: andres09otero/todo-app
  newTag: 3efa258b82afcb3d0211e5c5a738ef422217752f
- name: andres09otero/todo-backend
  newName: andres09otero/todo-backend
  newTag: 3efa258b82afcb3d0211e5c5a738ef422217752f
- name: andres09otero/todo-broadcaster
  newName: andres09otero/todo-broadcaster
  newTag: 3efa258b82afcb3d0211e5c5a738ef422217752f
- name: andres09otero/todo-random-article
  newName: andres09otero/todo-random-article
  newTag: 3efa258b82afcb3d0211e5c5a738ef422217752f
