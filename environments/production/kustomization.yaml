apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ejercicio 4.9, entorno production: la base del proyecto fijada al ULTIMO
# TAG (?ref=...), no a main. Asi un commit a main solo llega a staging, y
# production cambia unicamente cuando se publica un tag: el workflow
# .github/workflows/release-production.yaml construye las imagenes con el
# nombre del tag, actualiza este ref y las imagenes, y hace commit. Hasta
# el primer tag con entornos (4.9) apunta a 4.8, que es lo que ya corre.
resources:
- https://github.com/Andres02Otero/kubernetes-devops-submissions//environments/base?ref=4.9

# El namespace de siempre del proyecto: production conserva sus datos.
namespace: project
images:
- name: andres09otero/todo-app
  newName: andres09otero/todo-app
  newTag: "4.10"
- name: andres09otero/todo-backend
  newName: andres09otero/todo-backend
  newTag: "4.10"
- name: andres09otero/todo-broadcaster
  newName: andres09otero/todo-broadcaster
  newTag: "4.10"
- name: andres09otero/todo-random-article
  newName: andres09otero/todo-random-article
  newTag: "4.10"
