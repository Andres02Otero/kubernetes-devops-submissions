# Ejercicio 5.3: entrada a la app de log a traves de un gateway de Istio
# (clase istio), igual que Bookinfo en 5.2. Mismas reglas que el Gateway de
# GKE de 3.3/3.4 (../manifests-gke/). Se abre con:
#   kubectl port-forward svc/log-gateway-istio -n exercises 8099:80
apiVersion: gateway.networking.k8s.io/v1

kind: Gateway

metadata:
  name: log-gateway
  namespace: exercises
  annotations:
    # Service interno en vez de LoadBalancer: en k3d el 80/443 ya los usa
    # Traefik.
    networking.istio.io/service-type: ClusterIP

spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1

kind: HTTPRoute

metadata:
  name: log-route
  namespace: exercises

spec:
  parentRefs:
    - name: log-gateway

  rules:
    # ping-pong responde en / desde 3.4: la ruta publica /pingpong se reescribe.
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ping-pong-svc
          port: 3001

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: log-output-svc
          port: 2345
