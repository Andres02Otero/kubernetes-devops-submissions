apiVersion: apps/v1

kind: Deployment

metadata:
  name: log-output
  namespace: exercises

spec:
  replicas: 1

  selector:
    matchLabels:
      app: log-output

  template:
    metadata:
      labels: 
        app: log-output

    spec:
      volumes:
        - name: shared-status
          emptyDir: {}

        - name: config
          configMap:
            name: log-output-config

      containers:
        - name: writer
          image: andres09otero/log-output-writer:1.0.0
          volumeMounts:
            - name: shared-status
              mountPath: /usr/src/app/files

        - name: reader
          image: andres09otero/log-output-reader:1.3.0
          # Solo el reader lleva probe: es el que depende de ping-pong. El
          # writer queda listo siempre, por eso sin ping-pong el Pod marca 1/2.
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            httpGet:
              path: /healthz
              port: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          volumeMounts:
            - name: shared-status
              mountPath: /usr/src/app/files
            - name: config
              mountPath: /usr/src/app/config

