apiVersion: gateway.networking.k8s.io/v1

kind: HTTPRoute

metadata:
  name: exercises-route
  namespace: exercises

spec:
  # El Gateway define DONDE escucha el balanceador; esta ruta define A
  # DONDE manda el trafico. parentRefs la ata al Gateway de arriba.
  parentRefs:
    - name: exercises-gateway

  rules:
    # Gana la coincidencia de prefijo mas largo, por eso /pingpong no se
    # lo come la regla de /.
    # Desde 3.4 el filtro reescribe /pingpong -> / antes de llegar a la app:
    # la URL publica vive aqui y ping_pong solo conoce /.
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ping-pong-svc
          port: 3001

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: log-output-svc
          port: 2345
