apiVersion: v1

kind: Service

metadata:
  name: log-output-svc
  namespace: exercises

spec:
  # El Ingress de GKE exige NodePort (no lo expone fuera del cluster,
  # solo lo usa el balanceador L7 para llegar a los nodos).
  type: NodePort

  selector:
    app: log-output

  ports:
    - port: 2345
      protocol: TCP
      targetPort: 3000
