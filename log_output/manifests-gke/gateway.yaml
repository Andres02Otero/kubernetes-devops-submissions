apiVersion: gateway.networking.k8s.io/v1

kind: Gateway

metadata:
  name: exercises-gateway
  namespace: exercises

spec:
  # Clase recomendada por Google: balanceador L7 global externo.
  gatewayClassName: gke-l7-global-external-managed

  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
