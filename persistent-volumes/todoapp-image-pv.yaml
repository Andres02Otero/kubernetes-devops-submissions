apiVersion: v1

kind: PersistentVolume

metadata:
  name: todo-app-image-pv

spec:
  storageClassName: todo-app-image-storage

  capacity:
    storage: 100Mi

  volumeMode: Filesystem

  accessModes:
    - ReadWriteOnce

  local:
    path: /tmp/kube-todo-images

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3d-k3s-default-agent-0
