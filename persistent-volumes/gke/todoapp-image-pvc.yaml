apiVersion: v1

kind: PersistentVolumeClaim

metadata:
  name: todo-app-image-pvc
  namespace: project

spec:
  # Sin storageClassName y sin PersistentVolume a mano: en GKE el PV se
  # crea solo (disco persistente) al crear este claim. El PV local de k3d
  # (todoapp-image-pv.yaml) no aplica aqui.
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 100Mi
