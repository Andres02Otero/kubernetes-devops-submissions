# Desde el ejercicio 4.4 ping-pong ya no es un Deployment sino un Rollout de
# Argo Rollouts (requiere instalar sus CRDs en el cluster, ver README). La
# plantilla del Pod es la misma; lo nuevo es la estrategia canary.
apiVersion: argoproj.io/v1alpha1

kind: Rollout

metadata:
  name: ping-pong
  namespace: exercises

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ping-pong

  # Con 1 replica, setWeight 50 levanta 1 Pod canary junto al estable. Luego
  # corre el analisis de CPU (analysistemplate.yaml, 5 minutos); si falla,
  # Argo aborta, borra el canary y el estable sigue atendiendo: el update se
  # revierte solo. Si pasa, el canary reemplaza al estable.
  strategy:
    canary:
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: namespace-cpu-usage

  template:
    metadata:
      labels:
        app: ping-pong

    spec:
      containers:
        - name: ping-pong
          image: andres09otero/ping-pong:3.1.1
          # Listo solo si /healthz logra hablar con Postgres; mientras no,
          # el Pod sigue Running pero sale de los endpoints de ping-pong-svc.
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            httpGet:
              path: /healthz
              port: 3000
          env:
            - name: PORT
              value: "3000"
            - name: PGHOST
              value: "postgres-svc"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "postgres"
            - name: PGDATABASE
              value: "postgres"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
