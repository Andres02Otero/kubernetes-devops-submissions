apiVersion: v1

kind: Service

metadata:
  name: postgres-svc
  namespace: exercises
  labels:
    app: postgres

spec:
  clusterIP: None

  selector:
    app: postgres

  ports:
    - port: 5432
      name: postgres

---
apiVersion: apps/v1

kind: StatefulSet

metadata:
  name: postgres-ss
  namespace: exercises

spec:
  serviceName: postgres-svc
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            # Corregido en el ejercicio 4.2: antes el volumen se montaba en
            # /var/lib/postgresql, pero la imagen declara su propio volumen
            # anonimo en /var/lib/postgresql/data (donde vive la base), asi
            # que los datos nunca llegaban al PVC y se perdian al recrear el
            # Pod. Ahora el PVC se monta justo ahi, y PGDATA apunta a una
            # subcarpeta porque initdb exige un directorio vacio (los discos
            # de GKE traen lost+found en la raiz).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 100Mi
