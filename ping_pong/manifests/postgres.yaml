apiVersion: v1

kind: Service

metadata:
  name: postgres-svc
  namespace: exercises
  labels:
    app: postgres

spec:
  clusterIP: None

  selector:
    app: postgres

  ports:
    - port: 5432
      name: postgres

---
apiVersion: apps/v1

kind: StatefulSet

metadata:
  name: postgres-ss
  namespace: exercises

spec:
  serviceName: postgres-svc
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 100Mi
