apiVersion: networking.gke.io/v1

kind: HealthCheckPolicy

metadata:
  name: ping-pong-healthcheck
  namespace: exercises

spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        # No puede ser / (ahi vive el contador y cada chequeo lo
        # incrementaria). /pings es de solo lectura y responde 200.
        requestPath: /pings

  targetRef:
    group: ""
    kind: Service
    name: ping-pong-svc
