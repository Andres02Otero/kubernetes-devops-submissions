apiVersion: v1

kind: Service

metadata:
  name: ping-pong-svc
  namespace: exercises

spec:
  # Desde 3.2: NodePort porque el Ingress de GKE lo exige (en 3.1 era
  # LoadBalancer). Puerto 3001 igual que en k3d: log_output y el Ingress
  # ya apuntan a ping-pong-svc:3001.
  type: NodePort

  selector:
    app: ping-pong

  ports:
    - port: 3001
      protocol: TCP
      targetPort: 3000
