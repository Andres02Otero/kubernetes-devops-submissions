apiVersion: apps/v1

kind: Deployment

metadata:
  name: broadcaster
  namespace: project

spec:
  # 6 replicas porque el enunciado pide probar que escala sin duplicar
  # mensajes; el queue group de NATS reparte cada mensaje a una sola.
  replicas: 6

  selector:
    matchLabels:
      app: broadcaster

  template:
    metadata:
      labels:
        app: broadcaster

    spec:
      containers:
        - name: broadcaster
          image: andres09otero/todo-broadcaster:1.0.0
          # Proceso en reposo casi todo el tiempo; con 6 replicas los
          # requests van bajos para que quepan en el cluster.
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "96Mi"
          env:
            # NATS instalado con Helm (release my-nats, namespace nats).
            - name: NATS_URL
              value: "nats://my-nats.nats.svc.cluster.local:4222"
            # Opcion "Generic" del enunciado: cualquier URL que acepte un
            # POST JSON. Aqui apunta al receptor de prueba de
            # generic-receiver.yaml; para un servicio real basta cambiarla.
            - name: BROADCAST_URL
              value: "http://generic-receiver-svc/"
