name: Release project

# Ejercicio 4.8 (GitOps): reemplaza al pipeline "push" de GKE de los
# ejercicios 3.6 y 3.7, que se autenticaba en Google y hacia kubectl apply
# desde GitHub. Ahora el workflow no toca ningun cluster: construye las
# imagenes del proyecto, las sube a Docker Hub y hace commit de los tags
# nuevos en kustomization.yaml. ArgoCD, dentro del cluster, ve el commit y
# despliega. Solo main (el enunciado no pide entornos por rama).
on:
  push:
    branches:
      - main
    # Solo cambios de codigo necesitan imagenes nuevas; los cambios de
    # manifiestos ArgoCD los toma directo de git. El commit que hace este
    # workflow no lo vuelve a disparar (commits con GITHUB_TOKEN no lanzan
    # workflows).
    paths:
      - 'todo_app/src/**'
      - 'todo_app/package*.json'
      - 'todo_app/Dockerfile'
      - 'todo_backend/src/**'
      - 'todo_backend/package*.json'
      - 'todo_backend/Dockerfile'
      - 'todo_random_article/script.sh'
      - 'todo_random_article/Dockerfile'
      - 'todo_broadcaster/src/**'
      - 'todo_broadcaster/package*.json'
      - 'todo_broadcaster/Dockerfile'
  workflow_dispatch:

permissions:
  contents: write

# Mismo grupo que log-output-gitops.yaml: los dos hacen commit a main y
# dos pushes a la vez chocarian.
concurrency:
  group: gitops-release
  cancel-in-progress: false

jobs:
  build-publish-release:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Las cuatro con el mismo tag (SHA del commit): una version del
      # proyecto = un commit, trazable de punta a punta.
      - name: Build and publish the project images
        run: |-
          for app in todo-app todo-backend todo-random-article todo-broadcaster; do
            dir="${app//-/_}"
            docker build --tag "andres09otero/$app:$GITHUB_SHA" "$dir"
            docker push "andres09otero/$app:$GITHUB_SHA"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use the new images
        run: |-
          for app in todo-app todo-backend todo-random-article todo-broadcaster; do
            kustomize edit set image "andres09otero/$app=andres09otero/$app:$GITHUB_SHA"
          done

      - name: Commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: 'kustomization.yaml'
          message: Project new version released ${{ github.sha }}
