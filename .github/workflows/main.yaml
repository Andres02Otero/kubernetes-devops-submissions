name: Release project to staging

# Ejercicios 4.8 a 4.10 (GitOps): cada commit a main que cambia codigo del
# proyecto construye las imagenes, las sube a Docker Hub y hace commit de
# los tags nuevos en el overlay de staging del REPO DE CONFIGURACION
# (kubernetes-devops-project-config, desde 4.10). Este workflow no toca
# ningun cluster: ArgoCD lee ese repo y despliega.
on:
  push:
    branches:
      - main
    # Solo cambios de codigo necesitan imagenes nuevas.
    paths:
      - 'todo_app/src/**'
      - 'todo_app/package*.json'
      - 'todo_app/Dockerfile'
      - 'todo_backend/src/**'
      - 'todo_backend/package*.json'
      - 'todo_backend/Dockerfile'
      - 'todo_random_article/script.sh'
      - 'todo_random_article/Dockerfile'
      - 'todo_broadcaster/src/**'
      - 'todo_broadcaster/package*.json'
      - 'todo_broadcaster/Dockerfile'
  workflow_dispatch:

# Este repo solo se lee; el que se escribe es el de configuracion, con
# CONFIG_REPO_TOKEN (token con permiso de escritura solo sobre ese repo).
permissions:
  contents: read

concurrency:
  group: gitops-release
  cancel-in-progress: false

env:
  CONFIG_REPO: Andres02Otero/kubernetes-devops-project-config

jobs:
  build-publish-release:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout configuration repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Las cuatro con el mismo tag (SHA del commit de codigo).
      - name: Build and publish the project images
        run: |-
          for app in todo-app todo-backend todo-random-article todo-broadcaster; do
            dir="${app//-/_}"
            docker build --tag "andres09otero/$app:$GITHUB_SHA" "$dir"
            docker push "andres09otero/$app:$GITHUB_SHA"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use the new images in staging
        working-directory: config/overlays/staging
        run: |-
          for app in todo-app todo-backend todo-random-article todo-broadcaster; do
            kustomize edit set image "andres09otero/$app=andres09otero/$app:$GITHUB_SHA"
          done

      - name: Commit to the configuration repository
        uses: EndBug/add-and-commit@v10
        with:
          cwd: config
          add: 'overlays/staging/kustomization.yaml'
          message: Staging new version released ${{ github.repository }}@${{ github.sha }}
