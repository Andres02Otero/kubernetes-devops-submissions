name: Release project

# Cada push a main construye las tres imagenes del proyecto, las sube a
# Artifact Registry y despliega todo con Kustomize en GKE (ejercicio 3.6).
on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-images
  NAMESPACE: project
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    # Los secrets viven en este Environment de GitHub (no en el repo).
    environment: GKE_PROJECT
    env:
      PROJECT_ID: ${{ secrets.GKE_PROJECT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Sin llaves JSON guardadas: GitHub emite un token de corta duracion
      # y Google lo cambia por uno de la cuenta de servicio.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Use gcloud CLI
        run: gcloud info

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker "$REGISTRY"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          project_id: ${{ env.PROJECT_ID }}
          location: ${{ env.GKE_ZONE }}

      # Un mismo tag para las tres imagenes: rama + commit, asi cada
      # despliegue es trazable y nunca se reusa un tag.
      - name: Form the image names
        run: |-
          echo "IMAGE_BASE=$REGISTRY/$PROJECT_ID/$REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$BRANCH-$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Build
        run: |-
          docker build --tag "$IMAGE_BASE/todo-app:$IMAGE_TAG" todo_app
          docker build --tag "$IMAGE_BASE/todo-backend:$IMAGE_TAG" todo_backend
          docker build --tag "$IMAGE_BASE/todo-random-article:$IMAGE_TAG" todo_random_article

      - name: Publish
        run: |-
          docker push "$IMAGE_BASE/todo-app:$IMAGE_TAG"
          docker push "$IMAGE_BASE/todo-backend:$IMAGE_TAG"
          docker push "$IMAGE_BASE/todo-random-article:$IMAGE_TAG"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      # Los deployments traen el nombre de Docker Hub; Kustomize lo
      # reemplaza por la imagen recien publicada sin tocar los manifiestos.
      - name: Deploy
        run: |-
          kustomize edit set image andres09otero/todo-app="$IMAGE_BASE/todo-app:$IMAGE_TAG"
          kustomize edit set image andres09otero/todo-backend="$IMAGE_BASE/todo-backend:$IMAGE_TAG"
          kustomize edit set image andres09otero/todo-random-article="$IMAGE_BASE/todo-random-article:$IMAGE_TAG"
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/todo-backend -n "$NAMESPACE" --timeout=180s
          kubectl rollout status deployment/todo-app -n "$NAMESPACE" --timeout=180s
          kubectl get pods,services,gateway -n "$NAMESPACE" -o wide
