name: Release project to production

# Ejercicios 4.9 y 4.10: cada tag publica el proyecto en production.
# Construye las imagenes con el nombre del tag y hace commit en el REPO DE
# CONFIGURACION (desde 4.10) de overlays/production/kustomization.yaml: las
# imagenes <app>:<tag> y la base fijada al commit actual de ese repo
# (//base?ref=<sha>), para que cambios posteriores de la base solo lleguen a
# staging hasta el siguiente tag. ArgoCD ve el commit y despliega.
on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: gitops-release
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  CONFIG_REPO: Andres02Otero/kubernetes-devops-project-config

jobs:
  build-publish-release:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    steps:
      # El codigo del commit etiquetado, para construir las imagenes.
      - name: Checkout the tag
        uses: actions/checkout@v6

      - name: Checkout configuration repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish the project images
        run: |-
          for app in todo-app todo-backend todo-random-article todo-broadcaster; do
            dir="${app//-/_}"
            docker build --tag "andres09otero/$app:$TAG" "$dir"
            docker push "andres09otero/$app:$TAG"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      # La primera linea de resources es la base: local (../../base) hasta el
      # primer release, despues la base remota fijada a un commit.
      - name: Point production to the tag
        working-directory: config/overlays/production
        run: |-
          BASE_REF="$(git -C ../.. rev-parse HEAD)"
          sed -i "/^resources:/{n;s#^- .*#- https://github.com/$CONFIG_REPO//base?ref=$BASE_REF#}" kustomization.yaml
          for app in todo-app todo-backend todo-random-article todo-broadcaster; do
            kustomize edit set image "andres09otero/$app=andres09otero/$app:$TAG"
          done
          cat kustomization.yaml

      - name: Commit to the configuration repository
        uses: EndBug/add-and-commit@v10
        with:
          cwd: config
          add: 'overlays/production/kustomization.yaml'
          message: Production release ${{ github.ref_name }} (${{ github.repository }}@${{ github.sha }})
