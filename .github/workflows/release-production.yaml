name: Release project to production

# Ejercicio 4.9: cada tag publica el proyecto en production. Construye las
# imagenes con el nombre del tag y hace commit en main de
# environments/production/kustomization.yaml apuntando a ese tag: la base
# fijada a ese commit (?ref=<tag>) y las imagenes <app>:<tag>. ArgoCD ve el
# commit y despliega; un commit a main sin tag nunca llega a production.
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

# Mismo grupo que los otros workflows que hacen commit a main.
concurrency:
  group: gitops-release
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  build-publish-release:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    steps:
      # El codigo del commit etiquetado, para construir las imagenes.
      - name: Checkout the tag
        uses: actions/checkout@v6

      # main aparte: el commit de la nueva version va en main, no en el tag.
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: release

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish the project images
        run: |-
          for app in todo-app todo-backend todo-random-article todo-broadcaster; do
            dir="${app//-/_}"
            docker build --tag "andres09otero/$app:$TAG" "$dir"
            docker push "andres09otero/$app:$TAG"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      # Reemplaza la base remota por la de este tag y fija las imagenes.
      - name: Point production to the tag
        working-directory: release/environments/production
        run: |-
          sed -i "s#^  - https://github.com/.*#  - https://github.com/${{ github.repository }}//environments/base?ref=$TAG#" kustomization.yaml
          for app in todo-app todo-backend todo-random-article todo-broadcaster; do
            kustomize edit set image "andres09otero/$app=andres09otero/$app:$TAG"
          done
          cat kustomization.yaml

      - name: Commit environments/production/kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          cwd: release
          add: 'environments/production/kustomization.yaml'
          message: Production release ${{ github.ref_name }}
