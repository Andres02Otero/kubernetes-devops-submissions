apiVersion: batch/v1

kind: CronJob

metadata:
  name: todo-db-backup
  namespace: project

spec:
  # Una vez cada 24 horas, 03:00 UTC (22:00 en Colombia).
  schedule: "0 3 * * *"

  # Si un respaldo se demora, el siguiente no arranca encima.
  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2

      template:
        spec:
          restartPolicy: Never

          volumes:
            # Punto de paso entre los dos contenedores: uno escribe el
            # volcado y el otro lo sube.
            - name: backup
              emptyDir: {}

            # Llave de la cuenta de servicio. Se crea a mano con kubectl
            # (ver todo_backend/README.md) y nunca entra al repo.
            - name: storage-sa-key
              secret:
                secretName: storage-sa-key

          # Dos imagenes oficiales en vez de una propia: postgres trae
          # pg_dump y cloud-sdk trae gcloud, asi no hay nada que construir.
          initContainers:
            - name: dump
              image: postgres:16-alpine
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  pg_dump --format=custom --file="/backup/todo-$(date -u +%Y%m%dT%H%M%SZ).dump"
              env:
                - name: PGHOST
                  value: "postgres-svc"
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: "postgres"
                - name: PGDATABASE
                  value: "postgres"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backup
                  mountPath: /backup

          containers:
            - name: upload
              image: google/cloud-sdk:587.0.0-alpine
              # gcloud (Python) es el mas pesado de los dos: necesita ~100Mi solo para arrancar.
              resources:
                requests:
                  cpu: "50m"
                  memory: "96Mi"
                limits:
                  cpu: "250m"
                  memory: "384Mi"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  gcloud auth activate-service-account --key-file=/var/secrets/google/key.json
                  gcloud storage cp /backup/*.dump "gs://${BUCKET}/${POD_NAMESPACE}/"
              env:
                - name: BUCKET
                  value: "dwk-gke-510204-todo-backups"
                # Los respaldos de cada namespace (entorno por rama) quedan
                # en su propia carpeta del bucket.
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: storage-sa-key
                  mountPath: /var/secrets/google
                  readOnly: true
