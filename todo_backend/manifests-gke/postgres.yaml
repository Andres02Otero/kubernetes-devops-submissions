apiVersion: v1

kind: Service

metadata:
  name: postgres-svc
  namespace: project
  labels:
    app: postgres

spec:
  clusterIP: None

  selector:
    app: postgres

  ports:
    - port: 5432
      name: postgres

---
apiVersion: apps/v1

kind: StatefulSet

metadata:
  name: postgres-ss
  namespace: project

spec:
  serviceName: postgres-svc
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # Postgres en reposo usa ~30Mi; el limite deja margen para pg_dump y para crecer (ejercicio 3.11).
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Sin storageClassName a proposito: GKE aprovisiona un disco persistente solo
        # con su StorageClass por defecto (local-path solo existe en k3d).
        resources:
          requests:
            storage: 100Mi
