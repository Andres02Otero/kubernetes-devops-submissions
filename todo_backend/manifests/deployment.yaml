apiVersion: apps/v1

kind: Deployment

metadata:
  name: todo-backend
  namespace: project

spec:
  replicas: 1

  selector:
    matchLabels:
      app: todo-backend

  template:
    metadata:
      labels:
        app: todo-backend

    spec:
      containers:
        - name: todo-backend
          image: andres09otero/todo-backend:2.2.1
          # Ejercicio 4.2. Readiness: rota o sin Postgres = sin trafico.
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            httpGet:
              path: /readyz
              port: 3000
          # Liveness: solo mira si la app esta rota; tras 3 fallos seguidos
          # (~15 s) el kubelet reinicia el contenedor y vuelve sana.
          livenessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 3000
          resources:
            requests:
              cpu: "25m"
              memory: "48Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          env:
            - name: PORT
              value: "3000"
            - name: PGHOST
              value: "postgres-svc"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "postgres"
            - name: PGDATABASE
              value: "postgres"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
